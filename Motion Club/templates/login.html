{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Motion Club</title>
    <meta name="description" content="Entre na sua conta Motion Club." />
    <link rel="icon" type="image/png" href="{% static 'images/logo-m.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body class="auth-body">
    <main class="auth">
      <div class="auth__image-side">
        <div class="auth__photo media" style="background-image: url('{% static 'images/login-photo.png' %}')"></div>
        <div class="auth__photo-scrim"></div>
      </div>

      <a href="{% url 'home' %}" class="auth__logo logo" aria-label="Motion Club">
        <img src="{% static 'images/logo-m.png' %}" class="logo-img" alt="Motion Club" />
      </a>

      <div class="auth__form-side">
        <div class="auth__wrap">
          <div class="auth__bar">
            <a href="{% url 'home' %}" class="auth__back">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
              Voltar ao site
            </a>
            <span class="auth__secure"><span class="dot"></span> Acesso seguro</span>
          </div>

          <p class="auth__welcome">Bem-vindo de volta</p>
          <h1 class="auth__title">Entrar na<br /><span class="g">conta</span></h1>

          <hr class="auth__rule" />

          <div class="auth__social">
            <button type="submit" form="auth-login-form" name="provider" value="google" formnovalidate class="social-btn">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Continuar com Google
            </button>
            <button type="submit" form="auth-login-form" name="provider" value="apple" formnovalidate class="social-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 12.04c-.03-2.45 2-3.62 2.09-3.68-1.14-1.67-2.91-1.9-3.54-1.92-1.5-.15-2.95.89-3.71.89-.77 0-1.95-.87-3.21-.85-1.65.02-3.18.96-4.03 2.44-1.72 2.98-.44 7.39 1.23 9.81.81 1.18 1.78 2.51 3.05 2.46 1.23-.05 1.69-.79 3.18-.79 1.48 0 1.9.79 3.2.77 1.32-.02 2.16-1.2 2.97-2.39.93-1.37 1.31-2.7 1.33-2.77-.03-.01-2.55-.98-2.58-3.89zM14.6 4.84c.68-.83 1.14-1.97 1.01-3.12-.98.04-2.17.65-2.87 1.48-.63.73-1.18 1.9-1.03 3.02 1.09.08 2.21-.55 2.89-1.38z"/></svg>
              Continuar com Apple
            </button>
          </div>

          <div class="auth__or"><span>ou</span></div>

          <form class="auth__form" id="auth-login-form" method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" value="pietroflumignan@gmail.com" placeholder="voce@email.com" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="senha">Senha</label>
              <div class="field__pass">
                <input type="checkbox" id="show-pass" class="show-pass sr-only" />
                <input type="text" id="senha" name="senha" class="pass-input" value="senhasecreta" placeholder="••••••••" autocomplete="off" required />
                <label for="show-pass" class="toggle-pass" aria-label="Mostrar ou ocultar senha">
                  <svg class="ic-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="ic-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68M6.6 6.6C3.6 8.3 2 12 2 12s3.5 7 10 7a9 9 0 0 0 5.4-1.6M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </label>
              </div>
              <a href="#" class="auth__forgot">Esqueci minha senha →</a>
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg auth__submit">
              <span>Entrar</span>
              <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>

          <p class="auth__signup">Não tem uma conta? <a href="{% url 'member_create' %}">Cadastre-se grátis</a></p>

          <hr class="auth__rule auth__rule--faint" />

          <p class="auth__legal">Ao entrar, você concorda com os Termos de Uso e a Política de Privacidade do Motion Club.</p>
        </div>
      </div>
    </main>
  </body>
</html>
